# SPDX-License-Identifier: MIT
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    # One compile (about 8 minutes here): the ci profile only adds compiler OUTPUTS to the default settings (ASTs,
    # build info, storage layouts), never a setting that changes bytecode, so the build runs under it once and every
    # later step reuses it (the default-profile steps read a superset of what they need). Building under the default
    # profile first made the ci-profile test step compile everything again (measured locally: 329 s default build,
    # then 334 s of the 340 s test step recompiling, the 1,221 tests themselves about 5 s). On record since the list
    # release (04526b1, 1,553 tests): the build 20 minutes, `forge test` 17 minutes (it was 6: the long-list composites,
    # KernelGrowth at 60 actions and LoneNoGas), the model check 2, the whole job 40m03s, so a limit of 40 would fail a
    # healthy run. 60 leaves room until the slow suites are split or cut (tools/RELEASE.md item 15, "CI time").
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - run: forge soldeer install
      - run: pnpm check
      - run: forge fmt --check
      # Sizes and runtime bytes are the same under both profiles (the ci profile changes outputs only); building
      # under ci here is what lets `forge test` below skip its compile.
      - run: forge build --sizes
        env:
          FOUNDRY_PROFILE: ci
      # `pnpm check` above ran before anything was built, so its artifact checks (the two opcode lints and the
      # profile rules' no-immutables rule) were only reported as pending. Run them for real now that out/ exists.
      - run: pnpm check --built
      - run: pnpm layout:check
      - run: pnpm abi:check
      - run: forge test
        env:
          FOUNDRY_PROFILE: ci
      # The committed snapshot (release/, artifacts/, deploy/plan.json) must be the one this commit's sources build.
      - run: pnpm release:check
      # The planning model (gas/model.json) must be what this commit's prague bytes measure (amsterdam stays local).
      - run: pnpm gas:model:check
      # Fixture tooling: named instances side by side, each deployed from out/ and verified against the chain.
      - run: pnpm test:tools
